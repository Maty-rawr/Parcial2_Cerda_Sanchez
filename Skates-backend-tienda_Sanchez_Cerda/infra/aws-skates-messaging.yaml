AWSTemplateFormatVersion: "2010-09-09"
Description: SNS/SQS messaging topology and CloudWatch monitoring for the Skates application. Does not create or modify RDS, VPC, EC2, Cognito, or API Gateway resources.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedPattern: "^[a-z0-9-]{2,12}$"
    Description: Short environment prefix used in resource names.
  MaxReceiveCount:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 1000
    Description: Keep aligned with the backend SQS_MAX_RECEIVE_COUNT setting.
  QueueRetentionSeconds:
    Type: Number
    Default: 345600
    MinValue: 60
    MaxValue: 1209600
    Description: Main-queue retention; default is four days.
  QueueVisibilityTimeoutSeconds:
    Type: Number
    Default: 60
    MinValue: 1
    MaxValue: 43200
    Description: Visibility timeout for main queues; default is one minute.
  DeadLetterRetentionSeconds:
    Type: Number
    Default: 1209600
    MinValue: 60
    MaxValue: 1209600
    Description: Dead-letter retention; default is the SQS maximum of fourteen days.
  LongPollingSeconds:
    Type: Number
    Default: 20
    MinValue: 0
    MaxValue: 20
    Description: ReceiveMessageWaitTimeSeconds for main queues.

Resources:
  SkatesEventTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${EnvironmentName}-skates-events"
      DisplayName: Skates domain events

  OrdersDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${EnvironmentName}-skates-orders-dlq"
      MessageRetentionPeriod: !Ref DeadLetterRetentionSeconds
      SqsManagedSseEnabled: true

  OrdersQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${EnvironmentName}-skates-orders"
      VisibilityTimeout: !Ref QueueVisibilityTimeoutSeconds
      ReceiveMessageWaitTimeSeconds: !Ref LongPollingSeconds
      MessageRetentionPeriod: !Ref QueueRetentionSeconds
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt OrdersDeadLetterQueue.Arn
        maxReceiveCount: !Ref MaxReceiveCount

  InventoryDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${EnvironmentName}-skates-inventory-dlq"
      MessageRetentionPeriod: !Ref DeadLetterRetentionSeconds
      SqsManagedSseEnabled: true

  InventoryQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${EnvironmentName}-skates-inventory"
      VisibilityTimeout: !Ref QueueVisibilityTimeoutSeconds
      ReceiveMessageWaitTimeSeconds: !Ref LongPollingSeconds
      MessageRetentionPeriod: !Ref QueueRetentionSeconds
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt InventoryDeadLetterQueue.Arn
        maxReceiveCount: !Ref MaxReceiveCount

  NotificationsDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${EnvironmentName}-skates-notifications-dlq"
      MessageRetentionPeriod: !Ref DeadLetterRetentionSeconds
      SqsManagedSseEnabled: true

  NotificationsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${EnvironmentName}-skates-notifications"
      VisibilityTimeout: !Ref QueueVisibilityTimeoutSeconds
      ReceiveMessageWaitTimeSeconds: !Ref LongPollingSeconds
      MessageRetentionPeriod: !Ref QueueRetentionSeconds
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt NotificationsDeadLetterQueue.Arn
        maxReceiveCount: !Ref MaxReceiveCount

  OrdersQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref OrdersQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt OrdersQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref SkatesEventTopic

  InventoryQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref InventoryQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt InventoryQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref SkatesEventTopic

  NotificationsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref NotificationsQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt NotificationsQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref SkatesEventTopic

  OrdersSubscription:
    Type: AWS::SNS::Subscription
    DependsOn: OrdersQueuePolicy
    Properties:
      TopicArn: !Ref SkatesEventTopic
      Protocol: sqs
      Endpoint: !GetAtt OrdersQueue.Arn
      RawMessageDelivery: true
      FilterPolicy:
        eventType:
          - PAYMENT_COMPLETED
          - PAYMENT_REJECTED

  InventorySubscription:
    Type: AWS::SNS::Subscription
    DependsOn: InventoryQueuePolicy
    Properties:
      TopicArn: !Ref SkatesEventTopic
      Protocol: sqs
      Endpoint: !GetAtt InventoryQueue.Arn
      RawMessageDelivery: true
      FilterPolicy:
        eventType:
          - INVENTORY_UPDATED

  NotificationsSubscription:
    Type: AWS::SNS::Subscription
    DependsOn: NotificationsQueuePolicy
    Properties:
      TopicArn: !Ref SkatesEventTopic
      Protocol: sqs
      Endpoint: !GetAtt NotificationsQueue.Arn
      RawMessageDelivery: true
      FilterPolicy:
        eventType:
          - PAYMENT_COMPLETED
          - PAYMENT_REJECTED
          - INVENTORY_UPDATED

  OrdersDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${EnvironmentName}-skates-orders-dlq-not-empty"
      AlarmDescription: Orders messages require investigation or redrive.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt OrdersDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  InventoryDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${EnvironmentName}-skates-inventory-dlq-not-empty"
      AlarmDescription: Inventory messages require investigation or redrive.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt InventoryDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  NotificationsDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${EnvironmentName}-skates-notifications-dlq-not-empty"
      AlarmDescription: Notification messages require investigation or redrive.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt NotificationsDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  SkatesMessagingDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${EnvironmentName}-skates-messaging"
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Orders queue and DLQ",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "period": 60,
                "metrics": [
                  ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${OrdersQueue.QueueName}"],
                  [".", "ApproximateNumberOfMessagesNotVisible", ".", "."],
                  [".", "ApproximateAgeOfOldestMessage", ".", "."],
                  ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${OrdersDeadLetterQueue.QueueName}"]
                ]
              }
            },
            {
              "type": "metric",
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Inventory queue and DLQ",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "period": 60,
                "metrics": [
                  ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${InventoryQueue.QueueName}"],
                  [".", "ApproximateNumberOfMessagesNotVisible", ".", "."],
                  [".", "ApproximateAgeOfOldestMessage", ".", "."],
                  ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${InventoryDeadLetterQueue.QueueName}"]
                ]
              }
            },
            {
              "type": "metric",
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Notifications queue and DLQ",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "period": 60,
                "metrics": [
                  ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${NotificationsQueue.QueueName}"],
                  [".", "ApproximateNumberOfMessagesNotVisible", ".", "."],
                  [".", "ApproximateAgeOfOldestMessage", ".", "."],
                  ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${NotificationsDeadLetterQueue.QueueName}"]
                ]
              }
            }
          ]
        }

Outputs:
  SnsTopicArn:
    Value: !Ref SkatesEventTopic
  OrdersQueueUrl:
    Value: !Ref OrdersQueue
  OrdersDlqUrl:
    Value: !Ref OrdersDeadLetterQueue
  InventoryQueueUrl:
    Value: !Ref InventoryQueue
  InventoryDlqUrl:
    Value: !Ref InventoryDeadLetterQueue
  NotificationsQueueUrl:
    Value: !Ref NotificationsQueue
  NotificationsDlqUrl:
    Value: !Ref NotificationsDeadLetterQueue
  CloudWatchDashboardName:
    Value: !Ref SkatesMessagingDashboard
