spring.application.name=${APP_SERVICE_NAME:backend-skates-app}
spring.profiles.default=all

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
app.cognito.issuer-uri=${COGNITO_ISSUER_URI:}
app.cognito.client-ids=${COGNITO_CLIENT_IDS:${COGNITO_CLIENT_ID:}}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://localhost:5173,https://localhost:5174}
app.aws.region=${AWS_REGION:us-east-1}
app.messaging.enabled=${MESSAGING_ENABLED:false}
app.messaging.topic-arn=${SNS_TOPIC_ARN:}
app.messaging.orders-queue-url=${SQS_ORDERS_QUEUE_URL:}
app.messaging.orders-dlq-url=${SQS_ORDERS_DLQ_URL:}
app.messaging.inventory-queue-url=${SQS_INVENTORY_QUEUE_URL:}
app.messaging.inventory-dlq-url=${SQS_INVENTORY_DLQ_URL:}
app.messaging.notifications-queue-url=${SQS_NOTIFICATIONS_QUEUE_URL:}
app.messaging.notifications-dlq-url=${SQS_NOTIFICATIONS_DLQ_URL:}
app.messaging.max-receive-count=${SQS_MAX_RECEIVE_COUNT:5}
app.messaging.poll-interval-ms=${SQS_POLL_INTERVAL_MS:1000}
transbank.environment=${TRANSBANK_ENVIRONMENT:TEST}
transbank.commerce-code=${TRANSBANK_COMMERCE_CODE:597055555532}
transbank.api-key-secret=${TRANSBANK_API_KEY_SECRET:}
transbank.create-url=${TRANSBANK_CREATE_URL:https://webpay3gint.transbank.cl/rswebpaytransaction/api/webpay/v1.2/transactions}
transbank.return-url=${TRANSBANK_RETURN_URL:https://localhost:5173/pago/resultado}
